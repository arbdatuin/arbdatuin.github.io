<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Synology NAS architecture</title>
  <desc id="desc">A centralized Synology NAS architecture diagram showing head office, remote locations, branch access, and storage.</desc>
  <rect width="760" height="420" rx="16" fill="#161b22"/>
  <g fill="#0d1117" stroke="#79c0ff" stroke-width="2">
    <rect x="45" y="25" width="300" height="64" rx="10"/>
    <rect x="415" y="25" width="300" height="64" rx="10"/>
    <rect x="415" y="125" width="300" height="52" rx="10"/>
    <rect x="230" y="215" width="300" height="84" rx="10"/>
    <rect x="20" y="350" width="225" height="48" rx="10"/>
    <rect x="267" y="350" width="225" height="48" rx="10"/>
    <rect x="515" y="350" width="225" height="48" rx="10"/>
  </g>
  <g stroke="#79c0ff" stroke-width="2" fill="none">
    <path d="M195 89V195H380V215M565 89V125M565 177V195H380M380 295V350M380 295H132V350M380 295H628V350"/>
  </g>
  <g fill="#e6edf3" font-family="Arial, sans-serif" font-size="17">
    <text x="195" y="52" text-anchor="middle">Head office</text>
    <text x="195" y="73" text-anchor="middle" font-size="14">150 users (reported)</text>
    <text x="565" y="52" text-anchor="middle">Remote locations</text>
    <text x="565" y="73" text-anchor="middle" font-size="14">250 branches (reported)</text>
    <text x="565" y="157" text-anchor="middle">Remote access / VPN</text>
    <text x="380" y="249" text-anchor="middle" font-weight="bold">Synology DS1821+</text>
    <text x="380" y="274" text-anchor="middle" font-size="15">Centralized storage + RAID 1</text>
    <text x="132" y="379" text-anchor="middle">Shared folders / SMB</text>
    <text x="380" y="379" text-anchor="middle">Synology Drive</text>
    <text x="628" y="379" text-anchor="middle">User / group access</text>
  </g>
</svg>
